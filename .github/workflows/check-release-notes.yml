name: Release Notes Check
on:
  pull_request:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check release notes updated
        run: |
          PR_VERSION=$(grep -oE "'[0-9]{4}-[0-9]{2}-[0-9]{2}'" src/utils/releaseNotes.ts | head -1 | tr -d "'")
          BASE_VERSION=$(git show origin/main:src/utils/releaseNotes.ts | grep -oE "'[0-9]{4}-[0-9]{2}-[0-9]{2}'" | head -1 | tr -d "'")
          echo "Base RELEASE_VERSION : $BASE_VERSION"
          echo "PR   RELEASE_VERSION : $PR_VERSION"
          # Allow same-day re-releases: if version changed, always pass.
          # If version is the same, check that releaseNotes data file changed.
          if [ "$PR_VERSION" != "$BASE_VERSION" ]; then
            echo "✅ RELEASE_VERSION bumped ($BASE_VERSION → $PR_VERSION)"
            exit 0
          fi
          git show origin/main:src/data/releaseNotes.ts > /tmp/main-releaseNotes.ts
          if diff -q /tmp/main-releaseNotes.ts src/data/releaseNotes.ts > /dev/null 2>&1; then
            echo ""
            echo "❌ Release notes not updated."
            echo "   RELEASE_VERSION is still '$BASE_VERSION' — same as main, and releaseNotes data unchanged."
            echo "   Run /release-notes in Claude Code to draft an entry, then commit the result."
            exit 1
          fi
          echo "✅ Same-day re-release detected — releaseNotes data updated (RELEASE_VERSION: $PR_VERSION)"
